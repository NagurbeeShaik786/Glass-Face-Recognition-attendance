<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visage — Face Recognition Attendance</title>
    <link
      rel="icon"
      href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%237c5cff'/><circle cx='16' cy='13' r='5' fill='white'/><path d='M6 26c2-5 6-7 10-7s8 2 10 7' fill='white'/></svg>"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="aurora" aria-hidden="true">
      <span class="orb orb-a"></span>
      <span class="orb orb-b"></span>
      <span class="orb orb-c"></span>
    </div>

    <div class="app">
      <aside class="sidebar glass-panel">
        <div class="brand">
          <div class="brand-mark">
            <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
              <defs>
                <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#a78bfa" />
                  <stop offset="100%" stop-color="#22d3ee" />
                </linearGradient>
              </defs>
              <rect x="2" y="2" width="28" height="28" rx="9" fill="url(#bg)" />
              <circle cx="16" cy="14" r="4.5" fill="white" opacity="0.95" />
              <path d="M7.5 25c2-4.5 5.5-6.5 8.5-6.5s6.5 2 8.5 6.5" stroke="white" stroke-width="1.6" fill="none" stroke-linecap="round" />
            </svg>
          </div>
          <div class="brand-text">
            <div class="brand-name">Visage</div>
            <div class="brand-tag">Biometric Attendance</div>
          </div>
        </div>

        <nav class="nav">
          <a href="#/" data-route="/" class="nav-item">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
            Dashboard
          </a>
          <a href="#/recognize" data-route="/recognize" class="nav-item">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.5"/></svg>
            Live Recognition
          </a>
          <a href="#/enroll" data-route="/enroll" class="nav-item">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M3 21c1.5-3.5 4-5.5 6-5.5s4.5 2 6 5.5"/><path d="M19 8v6"/><path d="M16 11h6"/></svg>
            Enroll Person
          </a>
          <a href="#/people" data-route="/people" class="nav-item">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><circle cx="17" cy="9" r="3"/><path d="M2 21c1.5-3.5 4-5.5 7-5.5s5.5 2 7 5.5"/><path d="M14.5 14c1.2-.7 2.6-1 4-1 2 0 3.5 1 5 3"/></svg>
            Enrolled People
          </a>
          <a href="#/attendance" data-route="/attendance" class="nav-item">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            Attendance Log
          </a>
        </nav>

        <div class="sidebar-status glass-card">
          <div class="status-title">System Status</div>
          <div class="status-line">
            <span class="dot" id="model-dot"></span>
            <span id="model-status">Initializing</span>
          </div>
          <div class="status-meta">
            Python · OpenCV · Flask
          </div>
        </div>
      </aside>

      <main class="content">
        <div id="route-root"></div>
      </main>
    </div>

    <div id="toast-stack" class="toast-stack" aria-live="polite"></div>

    <script src="app.js" type="module"></script>
  </body>
</html>
